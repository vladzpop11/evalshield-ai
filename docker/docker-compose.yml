services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: evalshield-api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PORT=8000
      - ORT_NUM_THREADS=2
      - MLFLOW_TRACKING_URI=file:///app/src/ml/artifacts/mlruns
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    networks:
      - evalshield-net

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: evalshield-frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=101,gid=101,mode=0755
    cap_drop:
      - ALL
    networks:
      - evalshield-net

networks:
  evalshield-net:
    driver: bridge
