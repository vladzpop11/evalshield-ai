services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: evalshield-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ORT_NUM_THREADS=2
      - MLFLOW_TRACKING_URI=file:///app/src/ml/artifacts/mlruns
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - evalshield-net

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: evalshield-frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - evalshield-net

networks:
  evalshield-net:
    driver: bridge
