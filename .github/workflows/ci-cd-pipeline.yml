name: EvalShield-AI End-to-End MLOps & Quality Assurance

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Code Quality & Static Analysis
  # ============================================================================
  lint-and-typecheck:
    name: Lint & Static Typing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff Linter
        run: ruff check src/ tests/

  # ============================================================================
  # 2. ML Quality, Contracts & Behavioral Testing
  # ============================================================================
  ml-quality-suite:
    name: ML Quality & Behavioral Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-generate ML Model Artifacts
        run: python -m src.ml.model_generator

      - name: Execute ML Data Contracts & Behavioral Tests
        run: |
          pytest tests/ml_quality -v --cov=src/ml --cov-report=xml --cov-report=term

      - name: Upload ML Quality Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-quality-coverage
          path: coverage.xml

  # ============================================================================
  # 3. API Contract & Integration Tests
  # ============================================================================
  api-contract-tests:
    name: API Contract & Integration Tests
    runs-on: ubuntu-latest
    needs: [ml-quality-suite]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API & SDK Integration Tests
        run: |
          pytest tests/api -v --cov=src/api --cov=src/sdk --cov-report=term

  # ============================================================================
  # 4. E2E UI, Visual & WCAG Accessibility (Playwright + Axe)
  # ============================================================================
  e2e-ui-a11y-tests:
    name: E2E UI, Visual & WCAG 2.2 Accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: tests/e2e_ui/package.json

      - name: Install Playwright Dependencies
        working-directory: tests/e2e_ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Execute Playwright E2E & WCAG Accessibility Specs
        working-directory: tests/e2e_ui
        run: npx playwright test --project=chromium

      - name: Upload Playwright Test Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e_ui/playwright-report/
          retention-days: 14

  # ============================================================================
  # 5. Docker Orchestration Verification
  # ============================================================================
  docker-build-verification:
    name: Container Build & Compose Healthcheck
    runs-on: ubuntu-latest
    needs: [api-contract-tests, e2e-ui-a11y-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Start Services via Docker Compose
        run: |
          docker compose -f docker/docker-compose.yml up --build -d

      - name: Verify Service Healthiness
        run: |
          echo "Waiting for services to become healthy..."
          timeout 60s bash -c 'until [ "$(docker inspect -f {{.State.Health.Status}} evalshield-api)" == "healthy" ]; do sleep 2; done'
          timeout 60s bash -c 'until [ "$(docker inspect -f {{.State.Health.Status}} evalshield-frontend)" == "healthy" ]; do sleep 2; done'

      - name: Verify Live Endpoints
        run: |
          curl -f http://localhost:8000/health
          curl -f http://localhost:8080/

      - name: Teardown Services
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
